<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../login/login.css">
</head>
<body>

  <div class="login-container">
    <h2 class="text-center mb-3">Iniciar Sesión</h2>

    <form id="login-form">
      <div class="mb-3 icon-container">
        <label for="email" class="form-label">Correo Electrónico</label>
        <input type="email" id="email" name="email" class="form-control ps-4" placeholder="Tu email" required>
        <i class="bi bi-envelope"></i>
      </div>

      <div class="mb-3 icon-container">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" id="password" name="password" class="form-control ps-4" placeholder="Tu contraseña" required>
        <i class="bi bi-lock"></i>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
      </div>
    </form>

    <p class="text-center mt-3">
      ¿No tienes una cuenta? <a href="../register/register.html">Regístrate aquí</a>.
    </p>
  </div>

  <!-- Bootstrap JS & Icons -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.js"></script>
  <script src="login.js"></script>
</body>
</html>
