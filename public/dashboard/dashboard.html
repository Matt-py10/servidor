<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel de Biblioteca</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="./dashboard.css"/>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">📚 Reader</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" href="#">Dashboard</a>
        </li>
        <li class="nav-item">
          <button id="logoutButton" class="btn btn-outline-danger btn-sm">Cerrar sesión</button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Contenido principal -->
<div class="container mt-5">

  <!-- Tarjetas de estadísticas -->
  <div class="row text-center mb-4">
    <div class="col-md-4">
      <div class="stat-card">
        <div class="card-title">👤 Usuarios Totales</div>
        <h3 id="total-users">0</h3>
      </div>
    </div>
    <div class="col-md-4">
      <div class="stat-card">
        <div class="card-title">🟢 Sesiones Activas</div>
        <h3 id="active-sessions">0</h3>
      </div>
    </div>
    <div class="col-md-4">
      <div class="stat-card">
        <div class="card-title">🆕 Nuevos Registros</div>
        <h3 id="new-registrations">0</h3>
      </div>
    </div>
  </div>

  <!-- Filtro -->
  <div class="row mb-4">
    <div class="col-md-6 mx-auto category-filter">
      <label for="filter-category" class="form-label">Filtrar por categoría:</label>
      <select id="filter-category" class="form-select">
        <option value="all">Todas las categorías</option>
        <option value="novela">Novela</option>
        <option value="infantil">Infantil</option>
        <option value="ficcion">Ficción</option>
        <option value="clasico">Clásico</option>
        <option value="fantasia">Fantasía</option>
        <!-- Puedes añadir más -->
      </select>
    </div>
  </div>

  <!-- Libros -->
  <div class="row" id="book-list">
    <!-- Libros serán añadidos aquí por JS -->
  </div>

  <!-- Actividad reciente -->
  <div class="mt-5">
    <h4>📝 Actividad Reciente</h4>
    <ul id="recent-activities" class="list-group">
      <!-- Actividades se llenan por JS -->
    </ul>
  </div>
</div>

<!-- Bootstrap JS y dashboard.js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="./dashhboard.js"></script>
</body>
</html>
