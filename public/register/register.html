<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./register.css">

</head>
<body>
  <div class="container mt-5">
    <div class="text-center mb-4">
      <h2>Regístrate para vivir una mejor experiencia</h2>
      <p class="texto">
        Accede a libros exclusivos, lee de manera gratuita y descubre contenido que transformará tu forma de disfrutar la lectura.
      </p>
    </div>
    <div class="card p-4">
      <h1 class="text-center mb-3">Registro</h1>
      <form id="register-form">
        
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre:</label>
          <input type="text" id="nombre" name="nombre" class="form-control" required>
        </div>
        
        <div class="mb-3">
          <label for="nickname" class="form-label">nickname:</label>
          <input type="text" id="nickname" name="nickname" class="form-control" required>
        </div>
        
        <div class="mb-3">
          <label for="email" class="form-label">Correo Electrónico:</label>
          <input type="email" id="email" name="email" class="form-control" required>
        </div>
        
        <div class="mb-3">
          <label for="contraseña" class="form-label">Contraseña:</label>
          <input type="password" id="contraseña" name="contraseña" class="form-control" required>
        </div>
        
        <div class="mb-3">
          <label for="confirmar-contraseña" class="form-label">Confirmar Contraseña:</label>
          <input type="password" id="confirmar-contraseña" name="confirmar-contraseña" class="form-control" required>
        
          <div class="mb-3">
          <label for="perfil" class="mb-3">Perfil:</label>
          <select id="perfil" name="perfil" class="form-select shadow-sm border-primary rounded-3">
            <option value="lector">Usuario</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-success">Registrarse</button>
        </div>
        
      </form>
      <p class="text-center mt-3">
        ¿Ya tienes una cuenta? <a href="../login/login.html">Inicia sesión aquí</a>.
      </p>
    </div>
  </div>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="register.js"></script>
</body>
</html>
